services:
  - type: web
    name: nocturne-prints
    runtime: node
    plan: free
    buildCommand: cd web && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: ADMIN_PASSWORD
        generateValue: true
# NOTE: free tier has no persistent disk, so the SQLite file is ephemeral.
# The server auto-seeds the demo catalog on boot when the database is empty.
# For persistent orders/products, use a managed database (see README).
