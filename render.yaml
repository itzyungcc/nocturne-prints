databases:
  - name: nocturne-db
    plan: free
    databaseName: nocturne
    user: nocturne

services:
  - type: web
    name: nocturne-prints
    runtime: node
    plan: free
    buildCommand: cd web && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nocturne-db
          property: connectionString
# NOTE: the server uses PostgreSQL when DATABASE_URL is set, otherwise
# local node:sqlite (zero-config dev). It auto-seeds the demo catalog on
# boot when the database is empty. Orders/products now persist across
# deploys via the managed database.
